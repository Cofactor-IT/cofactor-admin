image: node:20

pipelines:
  pull-requests:
    "**":
      - step:
          name: Quality Checks
          caches:
            - node
          script:
            - npm ci
            - npm run prisma:generate:all
            - npm run lint
            - npm run type-check
            - npm run build
  branches:
    main:
      - step:
          name: Quality Checks
          caches:
            - node
          script:
            - npm ci
            - npm run prisma:generate:all
            - npm run lint
            - npm run type-check
            - npm run build
